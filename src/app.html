<!doctype html>
<html lang="tr">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<script>
		try {
			const stored = localStorage.getItem("theme");
			if (stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
				document.documentElement.classList.add("dark");
			}
		} catch {}
	</script>
	%sveltekit.head%
	<!-- 100% privacy-first analytics -->
	<scriptasyncdefersrc="https: //scripts.simpleanalyticscdn.com/latest.js">
		</script>
		<noscript>
			<imgsrc="https: //queue.simpleanalyticscdn.com/noscript.gif"alt="" referrerpolicy="no-referrer-when-downgrade" />
		</noscript>
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
